name: Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: "15 7 */9 * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    strategy:
      matrix:
        python-version: ["310", "311", "312", "313", "314", "314t"]
        runner: [ubuntu-slim]
        include:
          - python-version: "314"
            runner: macos-latest
          - python-version: "314"
            runner: windows-latest
          - python-version: "314"
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: boidolr/actions/run-tox@55472e5be1c24815f964f5648863c64e937c8cec # main
        with:
          python-version: ${{ matrix.python-version }}

  precommit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: boidolr/actions/run-precommit@55472e5be1c24815f964f5648863c64e937c8cec # main
        env:
          UV_PYTHON: "3.14"
