name: Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: "15 7 */9 * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    strategy:
      matrix:
        python-version: ["311", "312", "313", "314", "315", "315t"]
        runner: [ubuntu-slim]
        include:
          - python-version: "315"
            runner: macos-latest
          - python-version: "315"
            runner: windows-latest
          - python-version: "315"
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: boidolr/actions/run-tox@47e04d3a186f089ba7f55470b6a6519b0bd77bad # main
        with:
          python-version: ${{ matrix.python-version }}

  precommit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: boidolr/actions/run-precommit@47e04d3a186f089ba7f55470b6a6519b0bd77bad # main
        env:
          UV_PYTHON: "3.15"
